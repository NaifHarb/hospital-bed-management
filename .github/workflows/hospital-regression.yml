name: Hospital UI regression tests
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'tests/**'
      - '.github/workflows/hospital-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'tests/**'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/*.test.cjs

function go(k){page=k;render()}
function drawBeds(){let el=document.getElementById('bedTable');if(!el)return;let d=document.getElementById('filterDept').value;let beds=db.beds.filter(b=>!d||b.dept===d);let states=['ready','occupied','reserved','cleaning','maintenance'];el.innerHTML='<div class="bed-summary">'+states.map(s=>'<span>'+labels[s]+': <b>'+beds.filter(b=>b.status===s).length+'</b></span>').join('')+'</div><div class="bed-grid">'+beds.map(b=>'<article class="bed-card" data-status="'+attr(b.status)+'"><div class="bed-card-head"><strong>'+esc(b.id)+'</strong><span class="bed-symbol" aria-hidden="true">🛏️</span></div><div>'+pill(b.status)+'</div><div class="bed-meta"><div><b>القسم:</b> '+esc(b.dept)+'</div><div><b>نوع الرعاية:</b> '+esc(b.type)+'</div></div><div class="bed-checks"><span>النظافة: '+(b.clean?'✓ مكتملة':'✕ غير مكتملة')+'</span><span>المعدات: '+(b.equipment?'✓ متوفرة':'✕ ناقصة')+'</span></div>'+btn('إدارة السرير','manageBed(\''+attr(b.id)+'\\')','primary')+'</article>').join('')+'</div>';}
function addBed(){showForm('إضافة سرير',field('رقم السرير','id')+field('القسم','dept')+field('نوع الرعاية','type','select',[['تنويم','تنويم'],['عناية مركزة','عناية مركزة'],['ملاحظة','ملاحظة'],['أطفال','أطفال'],['عزل','عزل']]),v=>{if(db.beds.some(b=>b.id===v.id))return alert('رقم السرير موجود'),false;db.beds.push({id:v.id,dept:v.dept,type:v.type,status:'cleaning',clean:false,equipment:true});audit('إضافة سرير',v.id)})}
function manageBed(key){let b=db.beds.find(x=>x.id===key);if(!b)return;let options=b.status==='ready'?['إخراج للصيانة','إلغاء الجاهزية للتنظيف']:b.status==='occupied'?['تأكيد خروج المريض وبدء التنظيف']:b.status==='reserved'?['إلغاء الحجز بعد التحقق']:b.status==='cleaning'?['إنهاء التنظيف','إخراج للصيانة']:['إنهاء الصيانة (بانتظار التنظيف)'];let a=choice('إدارة السرير '+b.id+' — '+labels[b.status],options);if(!a)return;
if(a.includes('خروج')){let r=db.requests.find(r=>r.bed===b.id&&r.status==='arrived');if(!confirm('هل تؤكد الخروج الفعلي للمريض وبدء تنظيف السرير؟'))return;if(r){r.status='closed';r.bed=''}b.status='cleaning';b.clean=false}
else if(a.includes('إلغاء الحجز')){if(!confirm('هل تأكدت من عدم وصول المريض وعدم وجود نقل جارٍ؟'))return;let r=db.requests.find(r=>r.bed===b.id&&r.status==='reserved');if(r){r.bed='';r.status='accepted'}b.status=b.clean&&b.equipment?'ready':'cleaning'}
else if(a.includes('إنهاء التنظيف')){finishCleaning(b.id);return}
else if(a.includes('إنهاء الصيانة')){b.status='cleaning';b.clean=false}
else if(a.includes('الصيانة')){if(b.status==='ready'){b.status='maintenance';notify('خرج السرير '+b.id+' من الخدمة','warning')}else b.status='maintenance'}
else{b.status='cleaning';b.clean=false}
audit('تغيير حالة سرير',b.id+' ← '+labels[b.status]);render()}
function finishCleaning(key){let b=db.beds.find(x=>x.id===key);if(!b||b.status!=='cleaning')return alert('السرير ليس في حالة انتظار التنظيف');if(!confirm('هل اكتملت أعمال التنظيف فعلياً في هذه المحاكاة؟'))return;b.clean=true;audit('اكتمال تنظيف','السرير '+key);notify('اكتمل تنظيف '+key+' وينتظر اعتماد الجاهزية','warning');render()}
function approveBed(key){let b=db.beds.find(x=>x.id===key);if(!b||b.status!=='cleaning'||!b.clean||!b.equipment)return alert('لا يمكن الاعتماد: يجب اكتمال التنظيف وتوفر التجهيزات وعدم وجود إشغال أو صيانة');if(!confirm('هل تعتمد جاهزية السرير التشغيلية بعد التحقق؟'))return;b.status='ready';audit('اعتماد جاهزية سرير',key);render()}
function addRequest(){showForm('طلب استقبال مريض توضيحي',field('اسم توضيحي','patient')+field('رقم هوية توضيحي (10 أرقام)','identity')+field('مصدر الطلب','source','select',[['الطوارئ','الطوارئ'],['قسم داخلي','قسم داخلي'],['مستشفى آخر (محاكاة)','مستشفى آخر (محاكاة)'],['الهلال الأحمر (محاكاة)','الهلال الأحمر (محاكاة)']])+field('نوع الرعاية المطلوب','care','select',[['تنويم','تنويم'],['عناية مركزة','عناية مركزة'],['ملاحظة','ملاحظة'],['أطفال','أطفال'],['عزل','عزل']])+field('الأولوية','priority','select',[['عادي','عادي'],['عاجل','عاجل'],['حرج','حرج']]),v=>{if(!/^[0-9]{10}$/.test(v.identity))return alert('أدخل 10 أرقام توضيحية للهوية'),false;if(db.requests.some(r=>r.identity===v.identity&&!['closed','rejected'].includes(r.status)))return alert('يوجد طلب نشط محتمل لنفس الهوية التوضيحية؛ راجعه أولاً'),false;let r={id:'REQ-'+id().slice(0,9),...v,status:'pending',bed:''};db.requests.push(r);audit('إنشاء طلب استقبال',r.id);notify('طلب استقبال جديد '+r.id,v.priority==='حرج'?'critical':'warning')})}
function manageRequest(key){let r=db.requests.find(x=>x.id===key);if(!r)return;let opts=r.status==='pending'?['قبول','قبول مشروط','رفض']:r.status==='conditional'?['قبول','رفض']:r.status==='accepted'?['تخصيص سرير','إغلاق الطلب']:r.status==='reserved'?['تأكيد وصول المريض','تغيير السرير المحجوز','إلغاء الحجز']:r.status==='arrived'?['تأكيد خروج المريض','طلب نقل سريري']:[];if(!opts.length)return alert('الطلب مغلق');let a=choice('الطلب '+r.id+' — '+(labels[r.status]||r.status),opts);if(!a)return;
if(a==='قبول'){r.status='accepted'}
else if(a==='قبول مشروط'){r.status='conditional'}
else if(a==='رفض'){if(!confirm('تأكيد رفض الطلب التوضيحي؟'))return;r.status='rejected'}
else if(a==='تخصيص سرير'){return allocate(r,false)}
else if(a==='تأكيد وصول المريض'){let b=db.beds.find(b=>b.id===r.bed);if(!b||b.status!=='reserved')return alert('لا يوجد حجز مؤكد');if(!confirm('هل وصل المريض فعلياً؟'))return;b.status='occupied';b.clean=false;r.status='arrived'}
else if(a==='تغيير السرير المحجوز'){return allocate(r,true)}
else if(a==='إلغاء الحجز'){if(!confirm('تأكيد الإلغاء بعد التحقق من عدم الوصول؟'))return;let b=db.beds.find(b=>b.id===r.bed);if(b&&b.status==='reserved')b.status=b.clean&&b.equipment?'ready':'cleaning';r.bed='';r.status='accepted'}
else if(a==='تأكيد خروج المريض'){let b=db.beds.find(b=>b.id===r.bed);if(!b||b.status!=='occupied')return alert('حالة السرير غير متوافقة');if(!confirm('هل تأكدت من خروج المريض فعلياً؟'))return;b.status='cleaning';b.clean=false;r.status='closed';r.bed=''}
else if(a==='طلب نقل سريري'){return alert('نقل مريض مشغِل لسرير يتطلب موافقة الفريق الطبي المخوّل وتأكيد النقل الفعلي. لم تُنفذ هذه الخطوة تلقائياً في النسخة التوضيحية.')}
else if(a==='إغلاق الطلب'){r.status='closed'}
audit('تحديث طلب استقبال',r.id+' ← '+(labels[r.status]||r.status));render()}
function allocate(r,change){let available=db.beds.filter(b=>compatible(b,r));if(!available.length)return alert('لا يوجد سرير جاهز ومناسب لنوع الرعاية المطلوب');let remaining=db.beds.filter(bedAvailable).length;if(remaining<=Number(db.settings.reserveMin)&&!confirm('هذا التخصيص قد يستخدم الاحتياطي المقترح للطوارئ. هل تؤكد استثناءً توضيحياً؟'))return;let options=available.map(b=>b.id+' — '+b.dept);let selected=choice('اختر سريراً مناسباً',options);if(!selected)return;let newId=selected.split(' — ')[0],b=db.beds.find(b=>b.id===newId);if(!compatible(b,r))return alert('لم يعد السرير متاحاً');let old=db.beds.find(b=>b.id===r.bed);if(change&&(!old||old.status!=='reserved'))return alert('الحجز السابق غير مؤكد');if(!confirm('تأكيد '+(change?'نقل الحجز':'الحجز')+' إلى '+newId+'؟'))return;b.status='reserved';if(change&&old)old.status=old.clean&&old.equipment?'ready':'cleaning';r.bed=newId;r.status='reserved';audit(change?'تغيير سرير محجوز':'حجز سرير',r.id+' ← '+newId);render()}
function addEquipment(){showForm('إضافة جهاز طبي توضيحي',field('معرف الجهاز','id')+field('اسم الجهاز','name')+field('القسم','dept')+field('السرير المرتبط (اختياري)','bed','text',[],false),v=>{if(db.equipment.some(e=>e.id===v.id))return alert('معرف الجهاز موجود'),false;if(v.bed&&!db.beds.some(b=>b.id===v.bed))return alert('السرير غير موجود'),false;db.equipment.push({...v,status:'ready'});audit('إضافة جهاز',v.id)})}
function editEquipment(key){let e=db.equipment.find(e=>e.id===key);if(!e)return;let status=choice('حالة الجهاز '+key,['جاهز','مستخدم','صيانة']);if(!status)return;let dest=prompt('رقم السرير المرتبط الجديد (اتركه فارغاً لجهاز متنقل)',e.bed||'');if(dest===null)return;if(dest&&!db.beds.some(b=>b.id===dest))return alert('السرير غير موجود');if(!confirm('تأكيد تغيير الجهاز بواسطة فريق الأجهزة الطبية في هذه المحاكاة؟'))return;let old=e.bed;e.status=status;e.bed=dest;e.dept=db.beds.find(b=>b.id===dest)?.dept||e.dept;for(const bid of new Set([old,dest].filter(Boolean))){let b=db.beds.find(b=>b.id===bid);if(!b)continue;if(status==='صيانة'&&bid===dest){b.equipment=false;if(b.status==='ready'){b.status='maintenance';notify('تعطلت تجهيزات السرير '+bid,'critical')}}else if(bid===old&&old!==dest){b.equipment=false;if(b.status==='ready'){b.status='maintenance';notify('نُقل جهاز مرتبط بالسرير '+bid+' ويحتاج مراجعة الجاهزية')}}else if(bid===dest&&status==='جاهز'){b.equipment=true}}
audit('تحديث جهاز طبي',key+' — '+status+' — '+(dest||'غير مرتبط'));render()}
function addTransfer(){showForm('طلب تحويل خارجي توضيحي',field('جهة الاستقبال (اسم افتراضي)','target')+field('نوع الرعاية','care','select',[['تنويم','تنويم'],['عناية مركزة','عناية مركزة'],['ملاحظة','ملاحظة'],['أطفال','أطفال']])+field('الأولوية','priority','select',[['عادي','عادي'],['عاجل','عاجل'],['حرج','حرج']])+field('مرجع حالة توضيحي (دون بيانات شخصية)','reference'),v=>{let t={id:'TR-'+id().slice(0,9),...v,status:'pending'};db.transfers.push(t);audit('إنشاء تحويل توضيحي',t.id)})}
function manageTransfer(key){let t=db.transfers.find(t=>t.id===key);if(!t)return;let options=t.status==='pending'?['مرسل','مغلق']:t.status==='sent'?['قبول مشروط','مقبول','مرفوض','مغلق']:t.status==='conditional'?['مقبول','مرفوض']:t.status==='accepted'?['محجوز','مغلق']:t.status==='reserved'?['وصل','مغلق']:[];if(!options.length)return;let a=choice('تحديث محاكاة التحويل '+key,options);if(!a)return;if(['محجوز','وصل','مغلق'].includes(a)&&!confirm('هذه محاكاة فقط. هل تؤكد تسجيل الحالة دون إرسال خارجي؟'))return;t.status={'مرسل':'sent','قبول مشروط':'conditional','مقبول':'accepted','مرفوض':'rejected','محجوز':'reserved','وصل':'arrived','مغلق':'closed'}[a];audit('تحديث تحويل توضيحي',key+' ← '+a);render()}
function ackAlert(key){let a=db.alerts.find(a=>a.id===key);if(a){a.ack=true;audit('إقرار إشعار',key)}render()}
function ackAll(){db.alerts.forEach(a=>a.ack=true);audit('إقرار الإشعارات','جميع الإشعارات');render()}
function addRecovery(){showForm('توثيق عملية ورقية بعد الانقطاع',field('الوقت الفعلي','happened','datetime-local')+field('نوع العملية','type','select',[['دخول','دخول'],['خروج','خروج'],['نقل','نقل'],['تنظيف','تنظيف'],['حجز','حجز'],['صيانة','صيانة']])+field('رقم السرير','bed')+field('وصف دون بيانات شخصية','description','textarea'),v=>{if(!db.beds.some(b=>b.id===v.bed))return alert('رقم السرير غير موجود'),false;db.recovery.push({id:id(),...v,status:'pending'});audit('توثيق عملية ورقية للمطابقة',v.type+' '+v.bed);notify('توجد عملية ورقية تنتظر المطابقة للسرير '+v.bed)})}
function approveRecovery(key){let r=db.recovery.find(r=>r.id===key);if(!r)return;if(!confirm('هل تمت مراجعة السجل الورقي والتحقق من الحالة الفعلية بواسطة الجهات المخولة؟ هذا الاعتماد توضيحي ولا يغيّر السرير تلقائياً.'))return;r.status='approved';audit('اعتماد مطابقة ورقية',r.type+' '+r.bed);render()}
function csvDownload(name,rows){let csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(name,csv,'text/csv;charset=utf-8')}
function download(name,body,mime){let u=URL.createObjectURL(new Blob([body],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportBeds(){csvDownload('hospital-beds.csv',[['القسم','السرير','النوع','الحالة','النظافة','التجهيزات'],...db.beds.map(b=>[b.dept,b.id,b.type,labels[b.status],b.clean,b.equipment])])}
function exportAudit(){csvDownload('hospital-audit.csv',[['الوقت','الدور','العملية','التفاصيل'],...db.logs.map(l=>[l.time,l.actor,l.action,l.detail])])}
function exportJson(){download('hospital-demo-data.json',JSON.stringify(db,null,2),'application/json')}
function importJson(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let file=input.files?.[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!v||!Array.isArray(v.beds)||!Array.isArray(v.requests)||!Array.isArray(v.equipment)||!v.settings||!Array.isArray(v.logs))throw Error('ملف غير متوافق');if(!confirm('سيستبدل هذا الاستيراد البيانات التوضيحية الحالية. هل تتابع؟'))return;db={...structuredClone(initial),...v,settings:{...defaults,...v.settings}};audit('استيراد بيانات توضيحية',file.name);render()}catch(e){alert('تعذر الاستيراد: '+e.message)}};input.click()}
function resetDemo(){if(!confirm('حذف كل تغييرات التجربة وإعادة البيانات الافتراضية؟'))return;db=structuredClone(initial);persist();render()}
function saveSettings(){let v={};for(const k of ['hospital','actor','reserveMin','threshold'])v[k]=document.querySelector('[name="'+k+'"]').value;if(!v.hospital.trim()||!v.actor.trim())return alert('الاسم والدور مطلوبان');let reserve=Number(v.reserveMin),threshold=Number(v.threshold);if(!Number.isInteger(reserve)||reserve<0||reserve>100||!Number.isInteger(threshold)||threshold<1||threshold>100)return alert('راجع قيم الحدود');db.settings={hospital:v.hospital,actor:v.actor,reserveMin:reserve,threshold};audit('تغيير إعدادات توضيحية',v.hospital);render()}
updateAuth();render();
</script></body></html>

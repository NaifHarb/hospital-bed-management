<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>نظام إدارة الأسرة والطاقة الاستيعابية</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b44;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#102b49;color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:19px}header small{display:block;color:#c3d4e5;margin-top:5px}.tag{background:#285477;color:white;border-radius:30px;padding:7px 12px;font-size:12px}.shell{max-width:1300px;margin:auto;padding:22px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.nav button{border:1px solid #dce5ee;border-radius:12px;padding:12px 16px;white-space:nowrap;background:white;color:#28425e}.nav button.active{background:#176b91;color:white;border-color:#176b91}.panel{background:white;border:1px solid #e2eaf2;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #12345608}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat b{font-size:30px;display:block;margin:12px 0}.stat small{color:#66798c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}input,select{border:1px solid #cbd7e5;border-radius:10px;padding:11px;background:white;min-width:0}button.primary{background:#116c93;color:white;border:0;border-radius:10px;padding:11px 16px}button.secondary{background:#edf5f9;color:#115676;border:0;border-radius:10px;padding:10px}button.danger{background:#fff0f0;color:#a92d2d;border:0;border-radius:10px;padding:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:13px;border-bottom:1px solid #edf1f6;font-size:14px}th{color:#61758b;background:#f8fafc}.scroll{overflow:auto}.pill{display:inline-block;padding:5px 10px;border-radius:30px;font-size:12px;background:#e9eef5;color:#345}.ready{background:#e3f7ec;color:#16784c}.occupied{background:#e8eefb;color:#315ba3}.reserved{background:#fff3d8;color:#966008}.cleaning{background:#f0e8fb;color:#7851a2}.maintenance{background:#ffe7e7;color:#a33}.notice{padding:14px;background:#eef7fb;border-radius:12px;color:#23546d;font-size:13px;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #e1e9f1;border-radius:14px;padding:16px}.card h3{margin:0 0 8px}.card p{color:#66788c;font-size:13px;line-height:1.7}.hidden{display:none}dialog{border:0;border-radius:18px;padding:24px;max-width:450px;width:calc(100% - 32px);box-shadow:0 25px 70px #0004}dialog::backdrop{background:#12243d88}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:13px;color:#50657a}.footer{color:#8291a2;font-size:12px;text-align:center;padding:20px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}.shell{padding:13px}}@media(max-width:550px){.cards{grid-template-columns:1fr}header strong{font-size:15px}.panel{padding:14px}.grid{gap:8px}.stat b{font-size:25px}}
</style></head><body>
<header><div><strong>🏥 نظام إدارة الأسرة والطاقة الاستيعابية</strong><small>لوحة تشغيل المستشفى | Hospital Bed Management</small></div><span class="tag">نسخة تجريبية</span></header>
<main class="shell"><nav class="nav" id="nav"></nav><div id="content"></div><footer class="footer">بيانات تجريبية فقط • تخزين محلي على هذا المتصفح • لا يوجد اتصال بأنظمة طبية حقيقية</footer></main>
<dialog id="dialog"><form id="entryForm" class="form"><h3 id="formTitle"></h3><div id="fields"></div><div class="toolbar"><button class="primary" type="submit">حفظ</button><button class="secondary" type="button" onclick="document.getElementById('dialog').close()">إلغاء</button></div></form></dialog>
<script>
const seed={beds:[{id:'ICU-012',department:'العناية المركزة',type:'عناية مركزة',status:'ready'},{id:'ICU-013',department:'العناية المركزة',type:'عناية مركزة',status:'occupied'},{id:'ICU-014',department:'العناية المركزة',type:'عناية مركزة',status:'maintenance'},{id:'MED-101',department:'التنويم',type:'تنويم',status:'ready'},{id:'MED-102',department:'التنويم',type:'تنويم',status:'occupied'},{id:'MED-103',department:'التنويم',type:'تنويم',status:'reserved'},{id:'ER-021',department:'الطوارئ',type:'ملاحظة',status:'cleaning'},{id:'ER-022',department:'الطوارئ',type:'ملاحظة',status:'ready'},{id:'PED-031',department:'الأطفال',type:'أطفال',status:'occupied'},{id:'PED-032',department:'الأطفال',type:'أطفال',status:'ready'}],requests:[{id:'REQ-1001',patient:'مريض تجريبي ١',identity:'1000000001',source:'الطوارئ',status:'قيد التقييم',bed:''},{id:'REQ-1002',patient:'مريض تجريبي ٢',identity:'1000000002',source:'قسم التنويم',status:'محجوز',bed:'MED-103'}],equipment:[{id:'EQ-001',name:'جهاز مراقبة العلامات الحيوية',department:'العناية المركزة',status:'جاهز'},{id:'EQ-002',name:'مضخة محاليل',department:'التنويم',status:'جاهز'},{id:'EQ-003',name:'جهاز تنفس',department:'العناية المركزة',status:'صيانة'}],logs:[]};
const KEY='hospital-bed-ipad-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){data=JSON.parse(JSON.stringify(seed))}let page='dashboard';const labels={ready:'جاهز',occupied:'مشغول',reserved:'محجوز',cleaning:'قيد التنظيف',maintenance:'خارج الخدمة'};const tabs=[['dashboard','لوحة التحكم'],['beds','إدارة الأسرة'],['requests','المرضى والطلبات'],['equipment','المعدات الطبية'],['reports','التقارير'],['connections','التكاملات'],['settings','الإعدادات']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const log=t=>{data.logs.unshift({time:new Date().toLocaleString('ar-SA'),text:t});data.logs=data.logs.slice(0,60);save()};const count=s=>data.beds.filter(b=>b.status===s).length;const stat=(name,value,sub)=>'<div class="panel stat"><small>'+name+'</small><b>'+value+'</b><small>'+sub+'</small></div>';const status=s=>'<span class="pill '+esc(s)+'">'+(labels[s]||esc(s))+'</span>';const table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';const row=items=>'<tr>'+items.map(x=>'<td>'+x+'</td>').join('')+'</tr>';const panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>';const notice=t=>'<p class="notice">'+t+'</p>';
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,name])=>'<button class="'+(id===page?'active':'')+'" onclick="go(\''+id+'\')">'+name+'</button>').join('');let out='';
if(page==='dashboard'){let total=data.beds.length,used=count('occupied');out='<div class="grid">'+stat('إجمالي الأسرة',total,'جميع الأقسام')+stat('الأسرة الجاهزة',count('ready'),'متاحة للتقييم')+stat('الأسرة المشغولة',used,'الإشغال '+(total?Math.round(used/total*100):0)+'٪ من الإجمالي')+stat('الحجوزات المؤكدة',count('reserved'),'لم يصل المرضى بعد')+'</div>';out+=panel('نظرة عامة على الأقسام',table(['القسم','إجمالي الأسرة','جاهز','مشغول','محجوز'],[...new Set(data.beds.map(b=>b.department))].map(d=>{let a=data.beds.filter(b=>b.department===d);return row([esc(d),a.length,a.filter(b=>b.status==='ready').length,a.filter(b=>b.status==='occupied').length,a.filter(b=>b.status==='reserved').length])})));out+=panel('آخر العمليات',data.logs.length?data.logs.slice(0,6).map(l=>'<p class="muted">'+esc(l.time)+' — '+esc(l.text)+'</p>').join(''):notice('لا توجد عمليات جديدة بعد. يمكنك تجربة تغيير حالة سرير أو إنشاء طلب.'))}
if(page==='beds'){out=panel('إدارة الأسرة','<div class="toolbar"><button class="primary" onclick="openForm(\'bed\')">+ إضافة سرير</button><select id="deptFilter" onchange="drawBeds()"><option value="">جميع الأقسام</option>'+[...new Set(data.beds.map(b=>b.department))].map(d=>'<option>'+esc(d)+'</option>').join('')+'</select></div><div id="bedTable"></div>');}
if(page==='requests'){out=panel('طلبات استقبال المرضى','<div class="toolbar"><button class="primary" onclick="openForm(\'request\')">+ طلب جديد</button></div>'+notice('الأسماء والهويات أدناه تجريبية. القبول لا يعني حجز السرير، والحجز لا يعني الإشغال.')+table(['الطلب','المريض','مصدر الطلب','الحالة','السرير','إجراء'],data.requests.map(r=>row([esc(r.id),esc(r.patient),esc(r.source),esc(r.status),esc(r.bed||'—'),'<button class="secondary" onclick="manageRequest(\''+esc(r.id)+'\')">إدارة</button>']))));}
if(page==='equipment'){out=panel('سجل المعدات الطبية','<div class="toolbar"><button class="primary" onclick="openForm(\'equipment\')">+ إضافة جهاز</button></div>'+notice('في التشغيل الحقيقي تعتمد حركة المعدات وجاهزيتها من فريق الأجهزة الطبية والصيانة.')+table(['المعرف','الجهاز','القسم','الحالة','إجراء'],data.equipment.map(e=>row([esc(e.id),esc(e.name),esc(e.department),esc(e.status),'<button class="secondary" onclick="changeEquipment(\''+esc(e.id)+'\')">تغيير الحالة</button>']))));}
if(page==='reports'){let all=data.beds.length;out='<div class="grid">'+stat('نسبة الإشغال',all?Math.round(count('occupied')/all*100)+'٪':'0٪','من جميع الأسرة التجريبية')+stat('جاهز',count('ready'),'أسرة')+stat('تحتاج تجهيزاً',count('cleaning'),'أسرة')+stat('خارج الخدمة',count('maintenance'),'أسرة')+'</div>'+panel('توزيع حالات الأسرة',Object.keys(labels).map(k=>'<div style="margin:15px 0"><div class="toolbar" style="justify-content:space-between"><span>'+labels[k]+'</span><b>'+count(k)+'</b></div><div style="background:#edf2f7;border-radius:20px;height:11px;overflow:hidden"><div style="background:#19769b;width:'+(all?count(k)/all*100:0)+'%;height:100%"></div></div></div>').join('')+'<button class="secondary" onclick="exportCsv()">تصدير تقرير CSV</button>');}
if(page==='connections'){out=panel('الربط والتكاملات — عرض توضيحي',notice('هذه الأقسام توضح إمكانات النظام المستقبلية فقط. لا توجد اتصالات فعلية أو بيانات متبادلة.')+'<div class="cards">'+[['🏥','المستشفيات المرتبطة','طلبات تحويل المرضى وعرض السعة المسموح بمشاركتها'],['🏢','التجمع الصحي','متابعة مؤشرات الطاقة الاستيعابية والتقارير دون تعديل الأسرة'],['🚑','الهلال الأحمر','طلبات استقبال الإسعاف وتنسيق الوصول المتوقع'],['🔗','واجهات API','ربط آمن يتطلب خادماً وموافقات وإعدادات لاحقاً']].map(x=>'<div class="card"><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p><span class="pill">غير متصل — توضيحي</span></div>').join('')+'</div>');}
if(page==='settings'){out=panel('إعدادات النسخة التجريبية',notice('تُحفظ التغييرات في متصفح هذا الجهاز فقط. لا يوجد تسجيل دخول حقيقي أو مزامنة بين الأجهزة.')+'<div class="toolbar"><button class="secondary" onclick="downloadData()">تصدير نسخة بيانات JSON</button><button class="danger" onclick="resetData()">إعادة تعيين البيانات التجريبية</button></div>')+panel('وظائف تحتاج بنية تشغيل مستقبلية','<div class="cards">'+[['الصلاحيات والمصادقة','تحتاج Backend آمن للتحقق من الصلاحيات'],['النسخ الاحتياطي المؤسسي','يحتاج تخزيناً وخوادم وسياسة استعادة'],['الربط الخارجي','يحتاج موافقات وواجهات اتصال موثقة']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('')+'</div>');}
document.getElementById('content').innerHTML=out;if(page==='beds')drawBeds();}
function go(p){page=p;render()}function drawBeds(){let el=document.getElementById('bedTable');if(!el)return;let d=document.getElementById('deptFilter').value;el.innerHTML=table(['رقم السرير','القسم','النوع','الحالة','تغيير الحالة'],data.beds.filter(b=>!d||b.department===d).map(b=>row([esc(b.id),esc(b.department),esc(b.type),status(b.status),'<select aria-label="تغيير حالة السرير" onchange="changeBed(\''+esc(b.id)+'\',this.value)"><option value="">اختر الحالة</option>'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select>'])));}
function changeBed(id,next){if(!next)return;let b=data.beds.find(x=>x.id===id);if(!b)return;if(b.status==='occupied'&&next==='ready'){alert('لا يمكن جعل السرير المشغول جاهزاً مباشرة؛ يجب إتمام الخروج والتنظيف.');render();return}if(b.status==='reserved'&&next==='ready'&&!confirm('تأكد من إلغاء الحجز أو إعادة تخصيصه قبل تحرير السرير. هل تتابع في هذه المحاكاة؟')){render();return}b.status=next;log('تحديث حالة السرير '+id+' إلى '+labels[next]);render()}
function openForm(type){let specs={bed:['إضافة سرير',['رقم السرير','القسم','نوع السرير']],request:['طلب استقبال جديد',['اسم المريض التجريبي','رقم الهوية التجريبي','مصدر الطلب']],equipment:['إضافة جهاز',['معرف الجهاز','اسم الجهاز','القسم']]};let [title,fields]=specs[type];document.getElementById('formTitle').textContent=title;document.getElementById('fields').innerHTML=fields.map((f,i)=>'<label>'+f+'<input name="f'+i+'" required maxlength="90" autocomplete="off"></label>').join('');let form=document.getElementById('entryForm');form.dataset.type=type;form.reset();document.getElementById('dialog').showModal()}
document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();let f=e.target;let a=[0,1,2].map(i=>f.elements['f'+i].value.trim());let type=f.dataset.type;if(type==='bed'){if(data.beds.some(b=>b.id===a[0]))return alert('رقم السرير موجود بالفعل');data.beds.push({id:a[0],department:a[1],type:a[2],status:'cleaning'})}if(type==='request'){if(data.requests.some(r=>r.identity===a[1]&&r.status!=='مغلق'))return alert('يوجد طلب نشط بنفس رقم الهوية التجريبي. راجع الطلب الحالي.');data.requests.push({id:'REQ-'+Date.now().toString().slice(-8),patient:a[0],identity:a[1],source:a[2],status:'قيد التقييم',bed:''})}if(type==='equipment'){if(data.equipment.some(x=>x.id===a[0]))return alert('معرف الجهاز موجود');data.equipment.push({id:a[0],name:a[1],department:a[2],status:'جاهز'})}log('إضافة سجل جديد: '+a[0]);document.getElementById('dialog').close();render()});
function manageRequest(id){let r=data.requests.find(x=>x.id===id);if(!r)return;let action=prompt('أدخل الإجراء: قبول / حجز / وصول / إغلاق',r.status==='قيد التقييم'?'قبول':'حجز');if(!action)return;if(action==='قبول'){r.status='مقبول'}else if(action==='حجز'){let available=data.beds.filter(b=>b.status==='ready');if(!available.length)return alert('لا توجد أسرة جاهزة');let idBed=prompt('رقم السرير الجاهز:\n'+available.map(b=>b.id+' ('+b.department+')').join('، '),available[0].id);let b=available.find(b=>b.id===idBed);if(!b)return alert('السرير غير متاح');if(r.bed){let old=data.beds.find(b=>b.id===r.bed);if(old&&old.status==='reserved')old.status='ready'}b.status='reserved';r.bed=b.id;r.status='محجوز'}else if(action==='وصول'){let b=data.beds.find(b=>b.id===r.bed);if(!b||b.status!=='reserved')return alert('لا يوجد حجز مؤكد صالح');b.status='occupied';r.status='وصل'}else if(action==='إغلاق'){if(r.bed){let b=data.beds.find(b=>b.id===r.bed);if(b&&b.status==='occupied')return alert('يجب تسجيل خروج المريض وإتمام إجراءات السرير قبل إغلاق الطلب');if(b&&b.status==='reserved')b.status='ready'}r.status='مغلق'}else return alert('إجراء غير معروف');log('تحديث الطلب '+r.id+' إلى '+r.status);render()}
function changeEquipment(id){let e=data.equipment.find(x=>x.id===id);let s=prompt('حالة الجهاز: جاهز / مستخدم / صيانة',e.status);if(!['جاهز','مستخدم','صيانة'].includes(s))return;e.status=s;log('تغيير حالة الجهاز '+id+' إلى '+s);render()}
function exportCsv(){let rows=[['القسم','رقم السرير','النوع','الحالة'],...data.beds.map(b=>[b.department,b.id,b.type,labels[b.status]])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('beds-report.csv',csv,'text/csv;charset=utf-8')}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function downloadData(){download('hospital-demo-backup.json',JSON.stringify(data,null,2),'application/json')}
function resetData(){if(!confirm('هل تريد حذف جميع تغييرات النسخة التجريبية من هذا المتصفح؟'))return;data=JSON.parse(JSON.stringify(seed));save();render()}
render();
</script></body></html>
